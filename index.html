<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>動物分類接接樂</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden;
    font-family: "PingFang TC", "Microsoft JhengHei", "Noto Sans TC", "Helvetica Neue", sans-serif;
    background: #EAF4FF;
    user-select: none; -webkit-user-select: none;
  }
  #game { display: block; width: 100%; height: 100%; touch-action: none; }

  #hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 12px 16px; pointer-events: none; z-index: 10;
  }
  .pill {
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    border-radius: 999px; padding: 8px 18px;
    font-size: 15px; font-weight: 700; color: #2B4C7E;
    box-shadow: 0 4px 16px rgba(80,110,160,0.18);
    display: flex; align-items: center; gap: 6px; white-space: nowrap;
  }
  .pill .label { font-weight: 500; color: #7A8CA3; font-size: 13px; }
  .pill .val { font-size: 19px; color: #2563EB; }
  .pill .sep { color: #C4D0E0; font-weight: 400; }
  .pill .goal { color: #94A3B8; font-size: 14px; }

  #hint {
    position: fixed; top: 66px; left: 50%; transform: translateX(-50%);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
    padding: 9px 20px; border-radius: 999px;
    font-size: 15px; font-weight: 700; color: #3B5B8C;
    box-shadow: 0 6px 18px rgba(80,110,160,0.18);
    pointer-events: none; z-index: 10; white-space: nowrap;
    max-width: 92vw; overflow: hidden; text-overflow: ellipsis;
    transition: opacity .2s;
  }
  #hint.hide { opacity: 0; }

  #overlay {
    position: fixed; inset: 0;
    display: flex; align-items: center; justify-content: center;
    background: rgba(18, 38, 68, 0.45);
    backdrop-filter: blur(5px); -webkit-backdrop-filter: blur(5px);
    z-index: 100; opacity: 0; pointer-events: none;
    transition: opacity .25s ease; padding: 20px;
  }
  #overlay.show { opacity: 1; pointer-events: auto; }

  .panel {
    background: #fff; border-radius: 26px;
    padding: 30px 26px 26px;
    max-width: 420px; width: 100%;
    text-align: center;
    box-shadow: 0 24px 70px rgba(10,30,60,0.35);
    animation: pop .32s cubic-bezier(.2,.9,.3,1.4);
    max-height: 92vh; overflow-y: auto;
  }
  @keyframes pop { from { transform: scale(.88); opacity: 0 } to { transform: scale(1); opacity: 1 } }

  .big-emoji { font-size: 56px; line-height: 1; margin-bottom: 10px; }
  .panel h1 { font-size: 25px; margin: 0 0 12px; color: #1E3A5F; letter-spacing: .5px; }
  .panel p { font-size: 15px; color: #5A6B82; line-height: 1.75; margin: 0 0 20px; }
  .panel p b { color: #2563EB; }
  .panel .tip { font-size: 12.5px; color: #94A3B8; margin: 14px 0 0; line-height: 1.65; }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 9px; margin: 16px 0 22px; }
  .stats > div { background: #F1F5FB; border-radius: 14px; padding: 12px 4px 10px; }
  .stats span { display: block; font-size: 20px; font-weight: 800; color: #2B4C7E; line-height: 1.2; }
  .stats small { font-size: 11.5px; color: #7A8CA3; }

  .btn {
    display: inline-block; border: none;
    background: linear-gradient(135deg, #5B8DEF, #4361EE);
    color: #fff; font-size: 17px; font-weight: 700;
    padding: 14px 40px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
    box-shadow: 0 10px 24px rgba(67, 97, 238, .38);
    transition: transform .12s ease, box-shadow .12s ease;
    letter-spacing: 1px; margin: 4px 4px 0;
  }
  .btn:active { transform: scale(.95); box-shadow: 0 5px 14px rgba(67, 97, 238, .3); }
  .btn.ghost {
    background: #fff; color: #4361EE;
    border: 2px solid #C7D7F5;
    box-shadow: 0 4px 12px rgba(67, 97, 238, .12);
    font-size: 14.5px; padding: 11px 22px;
  }
  .btn.small { font-size: 14px; padding: 10px 22px; }

  .btn-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; margin-top: 8px; }

  .toast {
    position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: #1E3A5F; color: #fff; padding: 11px 24px;
    border-radius: 999px; font-size: 14px; font-weight: 700;
    opacity: 0; pointer-events: none; transition: all .25s ease; z-index: 200;
    box-shadow: 0 8px 24px rgba(10,30,60,0.3); white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (max-width: 420px) {
    .panel { padding: 24px 18px 20px; border-radius: 22px; }
    .panel h1 { font-size: 22px; }
    .btn { padding: 13px 30px; font-size: 16px; }
  }
</style>
</head>
<body>

<canvas id="game"></canvas>

<div id="hud">
  <div class="pill">
    <span class="label">分數</span>
    <span class="val" id="score">0</span>
    <span class="sep">/</span>
    <span class="goal" id="goal">70</span>
  </div>
  <div class="pill" id="levelTag">第 1 關</div>
</div>

<div id="hint" class="hide"></div>

<div id="overlay"></div>
<div class="toast" id="toast"></div>

<script>
/* =========================================================
   三關設定：每關要接住的分類不同
   - category : 人物身上顯示的分類名稱
   - hint     : 提示文字
   ========================================================= */
const LEVELS = [
  {
    name: "哺乳類",
    category: "哺乳類",
    hint: "接住「哺乳類」動物，其他動物不要接！",
    animals: [
      { name: "狗",     good: true  },
      { name: "貓",     good: true  },
      { name: "大象",   good: true  },
      { name: "鯨魚",   good: true  },
      { name: "蝙蝠",   good: true  },
      { name: "人類",   good: true  },
      { name: "兔子",   good: true  },
      { name: "猴子",   good: true  },
      { name: "青蛙",   good: false },
      { name: "鱷魚",   good: false },
      { name: "企鵝",   good: false },
      { name: "蝴蝶",   good: false },
      { name: "蛇",     good: false },
      { name: "鯊魚",   good: false },
      { name: "烏龜",   good: false }
    ]
  },
  {
    name: "鳥類",
    category: "鳥類",
    hint: "接住「鳥類」動物，其他動物不要接！",
    animals: [
      { name: "麻雀",   good: true  },
      { name: "老鷹",   good: true  },
      { name: "企鵝",   good: true  },
      { name: "鴕鳥",   good: true  },
      { name: "鸚鵡",   good: true  },
      { name: "天鵝",   good: true  },
      { name: "貓頭鷹", good: true  },
      { name: "鴿子",   good: true  },
      { name: "蝙蝠",   good: false },
      { name: "蝴蝶",   good: false },
      { name: "飛魚",   good: false },
      { name: "袋鼠",   good: false },
      { name: "松鼠",   good: false },
      { name: "蜻蜓",   good: false },
      { name: "海豚",   good: false }
    ]
  },
  {
    name: "水生動物",
    category: "水生動物",
    hint: "接住「水生動物」，其他動物不要接！",
    animals: [
      { name: "鯨魚",   good: true  },
      { name: "鯊魚",   good: true  },
      { name: "海豚",   good: true  },
      { name: "章魚",   good: true  },
      { name: "螃蟹",   good: true  },
      { name: "水母",   good: true  },
      { name: "海龜",   good: true  },
      { name: "小丑魚", good: true  },
      { name: "河馬",   good: false },
      { name: "鱷魚",   good: false },
      { name: "企鵝",   good: false },
      { name: "鴨子",   good: false },
      { name: "青蛙",   good: false },
      { name: "北極熊", good: false },
      { name: "海鷗",   good: false }
    ]
  }
];

const PASS_SCORE = 70;          // 過關分數
const WORDS_PER_LEVEL = 18;     // 每關掉落動物總數
const GOOD_RATIO = 0.65;        // 正確動物比例
const MISS_PENALTY = 5;         // 漏接扣分

const FONT = '"PingFang TC","Microsoft JhengHei","Noto Sans TC","Helvetica Neue",sans-serif';
const WORD_COLORS = ['#FFF3C4', '#D6F5E3', '#DCE9FF', '#FFE0E6', '#EDE2FF', '#FFEFD6', '#DFF6F8'];

/* ================= 基本設定 ================= */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const hintEl = document.getElementById('hint');
const toastEl = document.getElementById('toast');

let W = 0, H = 0, DPR = 1;

const game = {
  state: 'menu',
  levelIndex: 0,
  score: 0,
  words: [],
  particles: [],
  floats: [],
  queue: [],
  spawnTimer: 0,
  endTimer: 0,
  shake: 0,
  time: 0,
  stats: { good: 0, bad: 0, missed: 0 },
  player: { x: 0, y: 0, speed: 660 },
  keys: { left: false, right: false },
  pointerActive: false,
  pointerX: 0
};

/* ================= 尺寸 ================= */
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  game.player.y = H - 26;
  if (!game.player.x) game.player.x = W / 2;
  game.player.x = Math.max(46, Math.min(W - 46, game.player.x));
}
window.addEventListener('resize', resize);
window.addEventListener('orientationchange', () => setTimeout(resize, 120));

/* ================= 工具 ================= */
function roundRect(c, x, y, w, h, r) {
  r = Math.min(r, w / 2, h / 2);
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r);
  c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r);
  c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function shuffle(a) {
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}
function rand(a, b) { return a + Math.random() * (b - a); }
function rectsOverlap(a, b) {
  return a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;
}
function showToast(msg) {
  toastEl.textContent = msg;
  toastEl.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => toastEl.classList.remove('show'), 2000);
}

/* ================= 音效 ================= */
let audioCtx = null;
function initAudio() {
  if (!audioCtx) {
    try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { }
  }
  if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
}
function beep(freq, dur, type = 'sine', vol = 0.07) {
  if (!audioCtx) return;
  try {
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, audioCtx.currentTime);
    o.connect(g); g.connect(audioCtx.destination);
    g.gain.setValueAtTime(vol, audioCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
    o.start();
    o.stop(audioCtx.currentTime + dur);
  } catch (e) { }
}

/* ================= 粒子 / 飄字 ================= */
function burst(x, y, color, count) {
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const sp = rand(70, 230);
    game.particles.push({
      x, y,
      vx: Math.cos(a) * sp,
      vy: Math.sin(a) * sp - 80,
      life: rand(0.5, 0.9),
      maxLife: 0.9,
      color,
      size: rand(3, 7)
    });
  }
}
function addFloat(x, y, text, color, size) {
  game.floats.push({ x, y, text, color, size: size || 22, life: 1.05, maxLife: 1.05 });
}

/* ================= 遊戲流程 ================= */
function startLevel(i) {
  if (i >= LEVELS.length) i = 0;

  game.levelIndex = i;
  game.score = 0;
  game.words = [];
  game.particles = [];
  game.floats = [];
  game.spawnTimer = 0.7;
  game.endTimer = 0;
  game.shake = 0;
  game.stats = { good: 0, bad: 0, missed: 0 };
  game.player.x = W / 2;
  game.state = 'playing';

  const lv = LEVELS[i];
  const goodPool = lv.animals.filter(a => a.good).map(a => a.name);
  const badPool  = lv.animals.filter(a => !a.good).map(a => a.name);

  const goodCount = Math.round(WORDS_PER_LEVEL * GOOD_RATIO);
  const badCount = WORDS_PER_LEVEL - goodCount;

  const q = [];
  for (let k = 0; k < goodCount; k++) {
    q.push({ text: goodPool[Math.floor(Math.random() * goodPool.length)], good: true });
  }
  for (let k = 0; k < badCount; k++) {
    q.push({ text: badPool[Math.floor(Math.random() * badPool.length)], good: false });
  }
  shuffle(q);
  game.queue = q;

  overlay.classList.remove('show');
  hintEl.textContent = lv.hint;
  hintEl.classList.remove('hide');
  updateHUD();
}

function endLevel() {
  game.state = 'result';
  hintEl.classList.add('hide');

  const passed = game.score >= PASS_SCORE;
  const isLast = game.levelIndex >= LEVELS.length - 1;
  const attempted = game.stats.good + game.stats.bad;
  const acc = attempted > 0 ? Math.round((game.stats.good / attempted) * 100) : 0;

  let emoji, title, sub;
  if (passed && isLast) { emoji = '🏆'; title = '全部完成！'; sub = '你已經精通動物分類了！'; }
  else if (passed) { emoji = '🎉'; title = '過關！'; sub = `答對率 ${acc}%，繼續挑戰下一關！`; }
  else { emoji = '💪'; title = '再試一次'; sub = `還差 ${PASS_SCORE - game.score} 分就過關了，加油！`; }

  let btnLabel = '再試一次', btnAction = 'retry';
  if (passed && !isLast) { btnLabel = '下一關'; btnAction = 'next'; }
  else if (passed && isLast) { btnLabel = '再玩一次'; btnAction = 'restart'; }

  overlay.innerHTML = `
    <div class="panel">
      <div class="big-emoji">${emoji}</div>
      <h1>${title}</h1>
      <p>${sub}</p>
      <div class="stats">
        <div><span>${game.score}</span><small>得分</small></div>
        <div><span>${game.stats.good}</span><small>接對</small></div>
        <div><span>${game.stats.bad}</span><small>接錯</small></div>
        <div><span>${game.stats.missed}</span><small>漏接</small></div>
      </div>
      <button class="btn" data-action="${btnAction}">${btnLabel}</button>
      <div class="btn-row">
        <button class="btn ghost" data-action="menu">回主選單</button>
      </div>
      <p class="tip">接對 +10 分　接錯 −5 分　漏接 −${MISS_PENALTY} 分</p>
    </div>`;
  overlay.classList.add('show');

  if (passed) { beep(660, .12); setTimeout(() => beep(880, .16), 110); }
  else { beep(260, .2, 'sawtooth', .05); }
}

function showMenu() {
  game.state = 'menu';
  hintEl.classList.add('hide');
  overlay.innerHTML = `
    <div class="panel">
      <div class="big-emoji">🐾</div>
      <h1>動物分類接接樂</h1>
      <p>人物身上寫着一個分類，<br>接住<b>屬於該分類</b>的動物，避開不屬於的！<br>接對 <b>+10</b>、接錯 <b>−5</b>、漏接 <b>−${MISS_PENALTY}</b> 分。</p>
      <button class="btn" data-action="start">開始遊戲</button>
      <p class="tip">💻 鍵盤：← → 或 A D 鍵移動<br>📱 手機：按住畫面左右拖動<br>共 ${LEVELS.length} 關：${LEVELS.map(l => l.name).join('、')}</p>
    </div>`;
  overlay.classList.add('show');
}

function updateHUD() {
  document.getElementById('score').textContent = game.score;
  document.getElementById('goal').textContent = PASS_SCORE;
  document.getElementById('levelTag').textContent =
    `第 ${game.levelIndex + 1} 關 · ${LEVELS[game.levelIndex].name}`;
}

/* ================= 生成動物 ================= */
function spawnWord() {
  const item = game.queue.shift();
  if (!item) return;

  const fontSize = Math.round(Math.max(16, Math.min(26, W / 19)));
  ctx.save();
  ctx.font = `700 ${fontSize}px ${FONT}`;
  const tw = ctx.measureText(item.text).width;
  ctx.restore();

  const w = tw + 34;
  const h = fontSize + 24;
  const margin = 10;
  const maxX = Math.max(margin, W - w - margin);
  const x = rand(margin, maxX);

  const baseSpeed = 95 + game.levelIndex * 20;
  const vy = baseSpeed + rand(-15, 45);

  game.words.push({
    text: item.text,
    good: item.good,
    x, y: -h, w, h,
    vy,
    fontSize,
    color: WORD_COLORS[Math.floor(Math.random() * WORD_COLORS.length)],
    wobble: rand(0, Math.PI * 2)
  });
}

/* ================= 接住判定 ================= */
function getBasketRect() {
  const p = game.player;
  return { x: p.x - 40, y: p.y - 118, w: 80, h: 38 };
}

function catchWord(w) {
  const p = game.player;
  if (w.good) {
    game.score += 10;
    game.stats.good++;
    addFloat(p.x, p.y - 136, '+10', '#16A34A');
    burst(p.x, p.y - 100, '#4ADE80', 16);
    beep(620 + Math.random() * 80, 0.09, 'sine', 0.06);
  } else {
    game.score = Math.max(0, game.score - 5);
    game.stats.bad++;
    addFloat(p.x, p.y - 136, '−5', '#DC2626');
    burst(p.x, p.y - 100, '#F87171', 16);
    game.shake = 12;
    beep(150, 0.16, 'sawtooth', 0.05);
  }
  updateHUD();
}

function missWord(w) {
  game.score = Math.max(0, game.score - MISS_PENALTY);
  game.stats.missed++;
  addFloat(w.x + w.w / 2, H - 150, `漏接 −${MISS_PENALTY}`, '#F59E0B', 18);
  game.shake = 6;
  beep(200, 0.12, 'square', 0.04);
  updateHUD();
}

/* ================= 更新 ================= */
function updateParticles(dt) {
  for (let i = game.particles.length - 1; i >= 0; i--) {
    const p = game.particles[i];
    p.life -= dt;
    if (p.life <= 0) { game.particles.splice(i, 1); continue; }
    p.x += p.vx * dt;
    p.y += p.vy * dt;
    p.vy += 460 * dt;
    p.vx *= 0.985;
  }
  for (let i = game.floats.length - 1; i >= 0; i--) {
    const f = game.floats[i];
    f.life -= dt;
    f.y -= 62 * dt;
    if (f.life <= 0) game.floats.splice(i, 1);
  }
}

function update(dt) {
  game.time += dt;
  if (game.shake > 0) game.shake = Math.max(0, game.shake - dt * 70);

  updateParticles(dt);

  if (game.state !== 'playing') return;

  const p = game.player;
  let dir = 0;
  if (game.keys.left) dir -= 1;
  if (game.keys.right) dir += 1;

  if (game.pointerActive) {
    const dx = game.pointerX - p.x;
    if (Math.abs(dx) > 3) dir = Math.max(-1, Math.min(1, dx / 90));
  }

  p.x += dir * p.speed * dt;
  const half = 46;
  if (p.x < half) p.x = half;
  if (p.x > W - half) p.x = W - half;

  if (game.queue.length > 0) {
    game.spawnTimer -= dt;
    if (game.spawnTimer <= 0) {
      spawnWord();
      const base = Math.max(0.52, 0.9 - game.levelIndex * 0.055);
      game.spawnTimer = base + rand(0, 0.38);
    }
  }

  const basket = getBasketRect();
  for (let i = game.words.length - 1; i >= 0; i--) {
    const w = game.words[i];
    w.y += w.vy * dt;
    w.wobble += dt * 2;

    const rect = { x: w.x, y: w.y, w: w.w, h: w.h };
    if (rectsOverlap(rect, basket)) {
      catchWord(w);
      game.words.splice(i, 1);
      continue;
    }

    if (w.y > H + 30) {
      // 只有「正確動物」漏接才扣分；干擾動物掉下去不扣
      if (w.good) missWord(w);
      game.words.splice(i, 1);
    }
  }

  if (game.queue.length === 0 && game.words.length === 0) {
    game.endTimer += dt;
    if (game.endTimer > 0.85) endLevel();
  } else {
    game.endTimer = 0;
  }
}

/* ================= 繪製 ================= */
function drawWord(w) {
  ctx.save();
  ctx.shadowColor = 'rgba(80,105,145,0.22)';
  ctx.shadowBlur = 12;
  ctx.shadowOffsetY = 5;
  ctx.fillStyle = w.color;
  roundRect(ctx, w.x, w.y, w.w, w.h, 14);
  ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,0.9)';
  ctx.lineWidth = 2;
  roundRect(ctx, w.x + 1, w.y + 1, w.w - 2, w.h - 2, 13);
  ctx.stroke();
  ctx.restore();

  ctx.save();
  ctx.fillStyle = '#2F3E52';
  ctx.font = `700 ${w.fontSize}px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(w.text, w.x + w.w / 2, w.y + w.h / 2 + 1);
  ctx.restore();
}

function drawBasket(cx, top, w, h) {
  const left = cx - w / 2;
  ctx.save();
  ctx.beginPath();
  ctx.moveTo(left + 5, top);
  ctx.lineTo(left + w - 5, top);
  ctx.lineTo(left + w - 15, top + h);
  ctx.lineTo(left + 15, top + h);
  ctx.closePath();
  ctx.fillStyle = '#D79A5B';
  ctx.fill();
  ctx.strokeStyle = '#A96F35';
  ctx.lineWidth = 2.5;
  ctx.lineJoin = 'round';
  ctx.stroke();

  ctx.strokeStyle = 'rgba(169,111,53,0.5)';
  ctx.lineWidth = 1.6;
  for (let i = 1; i <= 2; i++) {
    const yy = top + (h * i) / 3;
    ctx.beginPath();
    ctx.moveTo(left + 8 + i * 2, yy);
    ctx.lineTo(left + w - 8 - i * 2, yy);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.ellipse(cx, top, w / 2 - 5, 8, 0, 0, Math.PI * 2);
  ctx.fillStyle = '#EBB582';
  ctx.fill();
  ctx.strokeStyle = '#A96F35';
  ctx.lineWidth = 2.5;
  ctx.stroke();
  ctx.restore();
}

function drawPlayer() {
  const p = game.player;
  const x = p.x, y = p.y;
  const lv = LEVELS[game.levelIndex];

  // 影子
  ctx.save();
  ctx.fillStyle = 'rgba(60,90,130,0.12)';
  ctx.beginPath();
  ctx.ellipse(x, y + 4, 40, 9, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.restore();

  // 身體
  ctx.save();
  const bodyGrad = ctx.createLinearGradient(x - 22, y - 54, x + 22, y);
  bodyGrad.addColorStop(0, '#6B9BF5');
  bodyGrad.addColorStop(1, '#4361EE');
  ctx.fillStyle = bodyGrad;
  roundRect(ctx, x - 22, y - 54, 44, 54, 17);
  ctx.fill();
  ctx.restore();

  // 身上分類標籤
  ctx.save();
  ctx.font = `800 15px ${FONT}`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  const tw = ctx.measureText(lv.category).width + 18;
  const labelY = y - 27;
  ctx.shadowColor = 'rgba(0,0,0,0.18)';
  ctx.shadowBlur = 6;
  ctx.shadowOffsetY = 2;
  ctx.fillStyle = '#FFFFFF';
  roundRect(ctx, x - tw / 2, labelY - 12, tw, 24, 12);
  ctx.fill();
  ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#1D4ED8';
  ctx.fillText(lv.category, x, labelY + 1);
  ctx.restore();

  // 手
  ctx.save();
  ctx.strokeStyle = '#FFD3AC';
  ctx.lineWidth = 7;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.moveTo(x - 19, y - 44); ctx.lineTo(x - 43, y - 90);
  ctx.moveTo(x + 19, y - 44); ctx.lineTo(x + 43, y - 90);
  ctx.stroke();
  ctx.restore();

  // 頭
  ctx.save();
  ctx.fillStyle = '#FFD9B3';
  ctx.beginPath();
  ctx.arc(x, y - 68, 16, 0, Math.PI * 2);
  ctx.fill();

  ctx.fillStyle = '#3A3A3A';
  ctx.beginPath();
  ctx.arc(x, y - 71, 16, Math.PI * 1.05, Math.PI * 1.95);
  ctx.fill();

  ctx.fillStyle = '#333';
  ctx.beginPath();
  ctx.arc(x - 5.5, y - 67, 2.1, 0, Math.PI * 2);
  ctx.arc(x + 5.5, y - 67, 2.1, 0, Math.PI * 2);
  ctx.fill();

  ctx.strokeStyle = '#B5714B';
  ctx.lineWidth = 1.8;
  ctx.lineCap = 'round';
  ctx.beginPath();
  ctx.arc(x, y - 62, 5, 0.18 * Math.PI, 0.82 * Math.PI);
  ctx.stroke();
  ctx.restore();

  // 籃子
  drawBasket(x, y - 118, 80, 40);
}

function render() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  ctx.save();
  if (game.shake > 0.5) {
    ctx.translate((Math.random() - 0.5) * game.shake, (Math.random() - 0.5) * game.shake);
  }

  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, '#E8F3FF');
  bg.addColorStop(0.55, '#F3F8FF');
  bg.addColorStop(1, '#FDF6EC');
  ctx.fillStyle = bg;
  ctx.fillRect(-30, -30, W + 60, H + 60);

  for (const w of game.words) drawWord(w);
  if (game.state !== 'menu') drawPlayer();

  for (const p of game.particles) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
    ctx.fillStyle = p.color;
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  for (const f of game.floats) {
    ctx.save();
    ctx.globalAlpha = Math.max(0, f.life / f.maxLife);
    ctx.fillStyle = f.color;
    ctx.font = `800 ${f.size}px ${FONT}`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.shadowColor = 'rgba(255,255,255,0.9)';
    ctx.shadowBlur = 8;
    ctx.fillText(f.text, f.x, f.y);
    ctx.restore();
  }

  ctx.restore();
}

/* ================= 主迴圈 ================= */
let lastTime = performance.now();
function loop(t) {
  let dt = (t - lastTime) / 1000;
  lastTime = t;
  if (dt > 0.05) dt = 0.05;
  update(dt);
  render();
  requestAnimationFrame(loop);
}

/* ================= 輸入 ================= */
window.addEventListener('keydown', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') { game.keys.left = true; e.preventDefault(); }
  if (k === 'ArrowRight' || k === 'd' || k === 'D') { game.keys.right = true; e.preventDefault(); }
  if (k === ' ' || k === 'Enter') {
    if (game.state === 'menu') { initAudio(); startLevel(0); }
  }
});
window.addEventListener('keyup', e => {
  const k = e.key;
  if (k === 'ArrowLeft' || k === 'a' || k === 'A') game.keys.left = false;
  if (k === 'ArrowRight' || k === 'd' || k === 'D') game.keys.right = false;
});
window.addEventListener('blur', () => {
  game.keys.left = false;
  game.keys.right = false;
  game.pointerActive = false;
});

canvas.addEventListener('pointerdown', e => {
  initAudio();
  game.pointerActive = true;
  game.pointerX = e.clientX;
  try { canvas.setPointerCapture(e.pointerId); } catch (err) { }
});
canvas.addEventListener('pointermove', e => {
  if (game.pointerActive) game.pointerX = e.clientX;
});
canvas.addEventListener('pointerup', () => { game.pointerActive = false; });
canvas.addEventListener('pointercancel', () => { game.pointerActive = false; });
canvas.addEventListener('pointerleave', () => { game.pointerActive = false; });

overlay.addEventListener('click', e => {
  const btn = e.target.closest('[data-action]');
  if (!btn) return;
  initAudio();
  const a = btn.dataset.action;
  if (a === 'start') startLevel(0);
  else if (a === 'next') startLevel(game.levelIndex + 1);
  else if (a === 'retry') startLevel(game.levelIndex);
  else if (a === 'restart') startLevel(0);
  else if (a === 'menu') showMenu();
});

/* ================= 啟動 ================= */
resize();
showMenu();
requestAnimationFrame(loop);
</script>
</body>
</html>
